name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - "main"

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  renew:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update
      - run: sudo apt-get install -y --no-install-recommends ca-certificates curl git
      - run: bash "${GITHUB_WORKSPACE}/build/build-linux-amd64.bash"
